<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.json">
<title>Meu Dinheiro</title>
<style>
:root{--bg:#0b0b0d;--card:#17171b;--card2:#202027;--text:#f5f5f7;--muted:#9b9ba5;--green:#65d391;--red:#ff7d86;--line:#2b2b33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:auto;padding:24px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.label{color:var(--muted);font-size:13px}.balance{font-size:34px;font-weight:750;margin:8px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:var(--card2);border-radius:15px;padding:13px}.mini strong{display:block;font-size:18px;margin-top:6px}
.green{color:var(--green)}.red{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:15px;font-weight:700;font-size:14px;background:var(--card2);color:var(--text)}.btn.primary{background:var(--text);color:#111}
.section-title{font-size:17px;font-weight:700;margin:22px 0 10px}.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#111116ee;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:35px;padding:14px 10px calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted)}
nav span:first-child{color:var(--text)}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:22px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:12px;margin:7px 0 12px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Meu Dinheiro</h1><div class="sub">Seu dinheiro, organizado.</div></div><div>🖤</div></div>
<section class="card">
<div class="label">Saldo disponível</div><div class="balance" id="balance">R$ 0,00</div>
<div class="grid"><div class="mini"><span class="label">Entradas</span><strong class="green" id="income">R$ 0,00</strong></div><div class="mini"><span class="label">Saídas</span><strong class="red" id="expense">R$ 0,00</strong></div></div>
</section>
<section class="card"><div class="label">🏍️ Lucro da 99 no mês</div><div class="balance" id="profit">R$ 0,00</div><div class="sub">Ganhos menos combustível e outros gastos.</div></section>
<div class="actions"><button class="btn primary" onclick="openModal('income')">＋ Registrar ganho</button><button class="btn" onclick="openModal('expense')">− Registrar gasto</button></div>
<div class="section-title">Últimos lançamentos</div><section class="card" id="list"><div class="empty">Nenhum lançamento ainda.</div></section>
</main>
<nav><span>⌂ Início</span><span>🏍️ 99 Moto</span><span>💳 Finanças</span><span>🎯 Metas</span></nav>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Novo lançamento</h2><label class="label">Descrição</label><input id="desc" placeholder="Ex.: Corridas do dia"><label class="label">Valor</label><input id="value" type="number" step="0.01" placeholder="0,00"><label class="label">Categoria</label><select id="category"><option>99 Moto</option><option>Salário</option><option>Combustível</option><option>Alimentação</option><option>Contas</option><option>Outros</option></select><div class="row"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="save()">Salvar</button></div></div></div>
<script>
let type='income', data=JSON.parse(localStorage.getItem('meuDinheiro')||'[]');
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function openModal(t){type=t;document.getElementById('modalTitle').textContent=t==='income'?'Registrar ganho':'Registrar gasto';document.getElementById('modal').classList.add('open');document.getElementById('desc').focus()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function save(){let desc=document.getElementById('desc').value.trim(), value=Number(document.getElementById('value').value), category=document.getElementById('category').value;if(!desc||!value)return alert('Preencha a descrição e o valor.');data.unshift({type,desc,value,category,date:new Date().toLocaleDateString('pt-BR')});localStorage.setItem('meuDinheiro',JSON.stringify(data));document.getElementById('desc').value='';document.getElementById('value').value='';closeModal();render()}
function render(){let inc=data.filter(x=>x.type==='income').reduce((a,x)=>a+x.value,0),exp=data.filter(x=>x.type==='expense').reduce((a,x)=>a+x.value,0);document.getElementById('income').textContent=money(inc);document.getElementById('expense').textContent=money(exp);document.getElementById('balance').textContent=money(inc-exp);let gains=data.filter(x=>x.type==='income'&&x.category==='99 Moto').reduce((a,x)=>a+x.value,0),costs=data.filter(x=>x.type==='expense'&&(x.category==='Combustível'||x.category==='99 Moto')).reduce((a,x)=>a+x.value,0);document.getElementById('profit').textContent=money(gains-costs);document.getElementById('list').innerHTML=data.length?data.slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${x.desc}</b><div class="sub">${x.category} · ${x.date}</div></div><b class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'−'} ${money(x.value)}</b></div>`).join(''):'<div class="empty">Nenhum lançamento ainda.</div>'}
render();
</script>
</body></html>
